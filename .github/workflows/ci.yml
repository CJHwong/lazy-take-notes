name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality (prek)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install system deps
        run: |
          sudo sed -i '/azure\.archive\.ubuntu\.com/d' /etc/apt/apt-mirrors.txt
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y --no-install-recommends \
            libportaudio2 libpulse-dev pulseaudio cmake
      - name: Start virtual audio server
        run: |
          pulseaudio --start --exit-idle-time=-1
          pactl load-module module-null-sink sink_name=test_loopback
      - run: uv sync
      - uses: j178/prek-action@v1

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}
      - name: Install system deps
        run: |
          sudo sed -i '/azure\.archive\.ubuntu\.com/d' /etc/apt/apt-mirrors.txt
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y --no-install-recommends \
            libportaudio2 libpulse-dev pulseaudio cmake
      - name: Start virtual audio server
        run: |
          pulseaudio --start --exit-idle-time=-1
          pactl load-module module-null-sink sink_name=test_loopback
      - run: uv sync
      - run: uv run pytest tests/ -v --cov=lazy_take_notes --cov-report=xml --cov-fail-under=90

  rust:
    name: Rust (macOS arm64)
    # The Rust app is released for macOS on Apple silicon only (release.yml).
    runs-on: macos-15
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned toolchain (rust/rust-toolchain.toml)
        run: rustup toolchain install
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      # transcribe decodes files with ffmpeg, and the file worker tests run it.
      - name: Install ffmpeg
        run: brew install ffmpeg
      - run: cargo test --locked
      # The .app window builds only with the gui feature, so lint and test it too.
      - run: cargo clippy --features gui --all-targets --locked -- -D warnings
      - run: cargo test --features gui --locked

  rust-linux:
    name: Rust (Linux ${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    env:
      # whisper.cpp defaults to -march=native; GCC 12 on ARM rejects its FP16 flags.
      GGML_NATIVE: OFF
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install system deps
        run: |
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            sudo sed -i '/azure\.archive\.ubuntu\.com/d' /etc/apt/apt-mirrors.txt
          fi
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y --no-install-recommends \
            cmake clang libclang-dev libasound2-dev ffmpeg
      - name: Install the pinned toolchain (rust/rust-toolchain.toml)
        run: rustup toolchain install
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked
      - run: uv run --script scripts/check_layers.py

  rust-windows:
    name: Rust (Windows x86_64)
    runs-on: windows-2022
    env:
      # whisper.cpp defaults to -march=native; keep the build portable.
      GGML_NATIVE: OFF
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned toolchain (rust/rust-toolchain.toml)
        run: rustup toolchain install
      # The file worker tests decode audio with ffmpeg.
      - name: Install ffmpeg
        run: choco install ffmpeg -y --no-progress
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked
