name: Release

# A tag v* builds the Rust app and the macOS .app, and publishes both as a
# GitHub Release. The Python launcher runs a release only after
# scripts/pin_rust_release.py pins it. A release tag without a hyphen also
# writes the Homebrew cask to CJHwong/homebrew-tap, when HOMEBREW_TAP_KEY is
# set. A manual run (workflow_dispatch) is a dry run: it builds and checks the
# packages and uploads them as artifacts, but publishes nothing.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  macos-arm64:
    name: Build (macOS arm64)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned toolchain (rust/rust-toolchain.toml)
        working-directory: rust
        run: rustup toolchain install
      - name: Build the package
        run: bash rust/scripts/package.sh
      - name: Check that the package starts
        run: |
          tar -xzf rust/dist/lazy-take-notes-arm64-macos.tar.gz -C "$RUNNER_TEMP"
          "$RUNNER_TEMP/lazy-take-notes-arm64-macos/lazy-take-notes" --version
          "$RUNNER_TEMP/lazy-take-notes-arm64-macos/lazy-take-notes" --help
          test -x "$RUNNER_TEMP/lazy-take-notes-arm64-macos/coreaudio-tap"
      # The app is signed with a self-signed certificate. macOS then keeps
      # its privacy permissions from one release to the next, which an ad hoc
      # signature does not. A tag must have the certificate; a dry run
      # without it signs ad hoc.
      - name: Import the signing certificate
        env:
          SIGN_P12: ${{ secrets.MACOS_SIGN_P12 }}
          SIGN_P12_PASSWORD: ${{ secrets.MACOS_SIGN_P12_PASSWORD }}
        run: |
          if [ -z "$SIGN_P12" ]; then
            if [ "$GITHUB_REF_TYPE" = tag ]; then
              echo "::error::MACOS_SIGN_P12 is not set, so a release would lose the users' permissions"
              exit 1
            fi
            echo "MACOS_SIGN_P12 is not set: this dry run signs ad hoc"
            exit 0
          fi
          keychain="$RUNNER_TEMP/sign.keychain-db"
          keychain_password=$(openssl rand -hex 16)
          echo "$SIGN_P12" | base64 --decode > "$RUNNER_TEMP/sign.p12"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -t 3600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$RUNNER_TEMP/sign.p12" -k "$keychain" -P "$SIGN_P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain" > /dev/null
          rm "$RUNNER_TEMP/sign.p12"
          # codesign on macOS 15 finds the private key only through the
          # search list, even with --keychain.
          # The runner's bash is 3.2, which has no mapfile.
          keychains=("$keychain")
          while read -r line; do
            keychains+=("$(echo "$line" | tr -d '"')")
          done < <(security list-keychains -d user)
          security list-keychains -d user -s "${keychains[@]}"
          echo "LTN_SIGN_IDENTITY=Lazy Take Notes Code Signing" >> "$GITHUB_ENV"
          echo "LTN_SIGN_KEYCHAIN=$keychain" >> "$GITHUB_ENV"
      - name: Build the app
        run: |
          bash rust/scripts/package_app.sh
          ditto -c -k --keepParent "rust/target/app/Lazy Take Notes.app" rust/dist/Lazy-Take-Notes-arm64-macos.zip
          (cd rust/dist && shasum -a 256 Lazy-Take-Notes-arm64-macos.zip > Lazy-Take-Notes-arm64-macos.zip.sha256)
      - name: Check that the app starts
        run: |
          ditto -x -k rust/dist/Lazy-Take-Notes-arm64-macos.zip "$RUNNER_TEMP/app"
          app="$RUNNER_TEMP/app/Lazy Take Notes.app"
          codesign --verify --strict "$app"
          if [ -n "${LTN_SIGN_IDENTITY:-}" ]; then
            codesign -d -r- "$app" 2>&1 | grep 'certificate leaf'
          fi
          test -f "$app/Contents/Resources/AppIcon.icns"
          test -x "$app/Contents/MacOS/coreaudio-tap"
          "$app/Contents/MacOS/lazy-take-notes" --version
      - name: Keep the packages
        uses: actions/upload-artifact@v4
        with:
          name: lazy-take-notes-arm64-macos
          path: |
            rust/dist/lazy-take-notes-arm64-macos.tar.gz
            rust/dist/lazy-take-notes-arm64-macos.tar.gz.sha256
            rust/dist/Lazy-Take-Notes-arm64-macos.zip
            rust/dist/Lazy-Take-Notes-arm64-macos.zip.sha256

  linux:
    name: Build (Linux ${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Install system deps
        run: |
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            sudo sed -i '/azure\.archive\.ubuntu\.com/d' /etc/apt/apt-mirrors.txt
          fi
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y --no-install-recommends \
            cmake clang libclang-dev libasound2-dev ffmpeg
      - name: Install the pinned toolchain (rust/rust-toolchain.toml)
        working-directory: rust
        run: rustup toolchain install
      - name: Build the package
        run: bash rust/scripts/package.sh
      - name: Check that the package starts
        run: |
          tar -xzf "rust/dist/lazy-take-notes-${{ matrix.arch }}-linux.tar.gz" -C "$RUNNER_TEMP"
          "$RUNNER_TEMP/lazy-take-notes-${{ matrix.arch }}-linux/lazy-take-notes" --version
          "$RUNNER_TEMP/lazy-take-notes-${{ matrix.arch }}-linux/lazy-take-notes" --help
      - uses: actions/upload-artifact@v4
        with:
          name: lazy-take-notes-${{ matrix.arch }}-linux
          path: |
            rust/dist/lazy-take-notes-${{ matrix.arch }}-linux.tar.gz
            rust/dist/lazy-take-notes-${{ matrix.arch }}-linux.tar.gz.sha256

  windows:
    name: Build (Windows x86_64)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned toolchain (rust/rust-toolchain.toml)
        working-directory: rust
        run: rustup toolchain install
      - name: Install the Vulkan SDK
        shell: pwsh
        run: |
          $installer = "$env:RUNNER_TEMP\vulkan-sdk.exe"
          Invoke-WebRequest 'https://sdk.lunarg.com/sdk/download/1.4.363.0/windows/vulkansdk-windows-X64-1.4.363.0.exe' -OutFile $installer
          Start-Process -FilePath $installer -ArgumentList '/S' -Wait
          if (-not (Test-Path 'C:\VulkanSDK')) { throw 'Vulkan SDK install failed' }
      - name: Build the package
        run: pwsh rust/scripts/package.ps1
      - name: Check that the package starts
        run: |
          Expand-Archive "rust/dist/lazy-take-notes-x86_64-windows.zip" -DestinationPath "$env:RUNNER_TEMP/win"
          & "$env:RUNNER_TEMP/win/lazy-take-notes-x86_64-windows/lazy-take-notes.exe" --version
          & "$env:RUNNER_TEMP/win/lazy-take-notes-x86_64-windows/lazy-take-notes.exe" --help
      - uses: actions/upload-artifact@v4
        with:
          name: lazy-take-notes-x86_64-windows
          path: |
            rust/dist/lazy-take-notes-x86_64-windows.zip
            rust/dist/lazy-take-notes-x86_64-windows.zip.sha256

  publish:
    name: Publish the release
    needs: [macos-arm64, linux, windows]
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - run: |
          prerelease=()
          [[ "$GITHUB_REF_NAME" == *-* ]] && prerelease=(--prerelease)
          gh release create "$GITHUB_REF_NAME" "${prerelease[@]}" \
            --title "lazy-take-notes $GITHUB_REF_NAME" \
            --notes "The Rust build for macOS on Apple silicon and Linux (x86_64 and arm64) and Windows (x86_64): the terminal app, and the window app as Lazy Take Notes.app on macOS. Install: brew install --cask CJHwong/tap/lazy-take-notes on macOS, setup.sh on Linux, or unzip and run lazy-take-notes.exe on Windows. Windows needs ffmpeg for file transcription: winget install Gyan.FFmpeg." \
            dist/lazy-take-notes-arm64-macos.tar.gz dist/lazy-take-notes-arm64-macos.tar.gz.sha256 \
            dist/Lazy-Take-Notes-arm64-macos.zip dist/Lazy-Take-Notes-arm64-macos.zip.sha256 \
            dist/lazy-take-notes-x86_64-linux.tar.gz dist/lazy-take-notes-x86_64-linux.tar.gz.sha256 \
            dist/lazy-take-notes-arm64-linux.tar.gz dist/lazy-take-notes-arm64-linux.tar.gz.sha256 \
            dist/lazy-take-notes-x86_64-windows.zip dist/lazy-take-notes-x86_64-windows.zip.sha256

  homebrew:
    name: Update the Homebrew cask
    needs: publish
    # A prerelease (a tag with a hyphen) leaves the cask alone.
    if: github.event_name == 'push' && !contains(github.ref_name, '-')
    runs-on: ubuntu-24.04
    env:
      # The private half of a deploy key that can write to CJHwong/homebrew-tap only.
      TAP_KEY: ${{ secrets.HOMEBREW_TAP_KEY }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check for the tap key
        if: env.TAP_KEY == ''
        run: echo "::warning::HOMEBREW_TAP_KEY is not set. Write Casks/lazy-take-notes.rb with rust/scripts/homebrew_cask.sh by hand."
      - uses: actions/checkout@v4
        if: env.TAP_KEY != ''
      - name: Write the cask
        if: env.TAP_KEY != ''
        run: |
          version="${GITHUB_REF_NAME#v}"
          gh release download "$GITHUB_REF_NAME" --pattern 'Lazy-Take-Notes-arm64-macos.zip.sha256' --dir "$RUNNER_TEMP"
          sha256=$(cut -d ' ' -f 1 "$RUNNER_TEMP/Lazy-Take-Notes-arm64-macos.zip.sha256")
          key="$RUNNER_TEMP/tap_key"
          printf '%s\n' "$TAP_KEY" > "$key"
          chmod 600 "$key"
          export GIT_SSH_COMMAND="ssh -i $key -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new"
          git clone git@github.com:CJHwong/homebrew-tap.git tap
          mkdir -p tap/Casks
          sh rust/scripts/homebrew_cask.sh "$version" "$sha256" > tap/Casks/lazy-take-notes.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/lazy-take-notes.rb
          git commit -m "lazy-take-notes ${version}"
          git push
