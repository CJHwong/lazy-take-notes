[package]
name = "lazy-take-notes"
version = "0.3.5"
edition = "2024"

[[bin]]
name = "lazy-take-notes"
path = "src/main.rs"

# The executable of the macOS .app: the window with no arguments, the command
# line with any. Only `--features gui` builds it.
[[bin]]
name = "lazy-take-notes-gui"
path = "src/gui_main.rs"
required-features = ["gui"]

[features]
# The native window. Off by default: the release tarball has no GPUI.
gui = ["dep:gpui-kit", "dep:cocoa", "dep:objc"]
# The GPUI Kit test helpers for the window's tests.
gui-test = ["gui", "gpui-kit/test-support"]
# whisper.cpp's Vulkan backend. Off by default: the build needs the Vulkan SDK.
vulkan = ["whisper-rs/vulkan"]

[dependencies]
async-trait = "0.1.92"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
clap = { version = "4", features = ["derive", "env"] }
cpal = "0.18.2"
crossterm = { version = "0.29.0", features = ["event-stream"] }
dirs = "7.0.0"
fancy-regex = "0.20.2"
flate2 = "1.1.11"
gpui-kit = { version = "=0.11.0", optional = true }
# The Dock icon of a run outside the .app. The same versions gpui uses, so
# they add no crate to the build.
cocoa = { version = "=0.25.0", optional = true }
objc = { version = "=0.2.7", optional = true }
futures-util = { version = "0.3.34", default-features = false }
indexmap = { version = "2.14.2", features = ["serde"] }
libc = "0.2.191"
pulldown-cmark = { version = "0.13.6", default-features = false }
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm", "underline-color"] }
regex = "1.13.2"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json", "stream", "system-proxy"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order", "float_roundtrip"] }
sha2 = "0.11.1"
signal-hook = "0.3"
tar = "0.4.46"
tempfile = "3.27.0"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt", "rt-multi-thread", "macros", "time", "sync", "net", "io-util", "signal"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["registry", "std"] }
unicode-width = "0.2.3"
whisper-rs = "0.16.0"
yaml_serde = "0.10.7"
fs4 = "1.1.0"

[target.'cfg(target_os = "macos")'.dependencies]
# whisper.cpp's Metal backend builds only on macOS.
whisper-rs = { version = "0.16.0", features = ["metal"] }

[target.'cfg(target_os = "linux")'.dependencies]
# The pure Rust PulseAudio client: no libpulse, and the monitor sources cpal's
# ALSA host cannot see. Linux still builds ALSA too, so libasound2-dev is needed.
cpal = { version = "0.18.2", features = ["pulseaudio"] }

[target."cfg(windows)".dependencies]
wasapi = "0.27.0"
windows-sys = { version = "0.61.2", features = ["Win32_Storage_FileSystem", "Win32_System_Power", "Win32_System_Threading", "Win32_System_Console", "Win32_Foundation"] }

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["macros", "rt", "sync", "time", "test-util"] }
tracing-subscriber = "0.3.23"
