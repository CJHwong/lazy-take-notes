[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lazy-take-notes"
version = "0.1.0"
description = "live transcription & AI summaries in your terminal."
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = "MIT"
authors = [{name = "Hoss", email = "CJHwong@gmail.com"}]
keywords = ["transcription", "meeting-notes", "whisper", "ollama", "tui"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]
dependencies = [
    # Pinned to 8.0.x: 8.2.7's Kitty keyboard-protocol support (PR #6544) breaks
    # CJK/IME composition in TextArea on some terminals. See git blame / PR.
    "textual>=8.0,<8.1",
    # Runtime deps pinned to their current latest so uvx installs are reproducible
    # (uvx resolves from these constraints, not from uv.lock).
    "pywhispercpp==1.4.1",
    "ollama==0.6.1",
    "openai==2.23.0",
    "pydantic==2.12.5",
    "pydantic-settings==2.13.0",
    "pyyaml==6.0.3",
    "click==8.3.1",
    "sounddevice==0.5.5",
    # TODO: remove _patch_soundcard_numpy2_compat() when soundcard >0.4.5 ships the numpy 2.x fix
    "soundcard==0.4.5",
    "numpy==2.4.2",
    "huggingface_hub==1.4.1",
    "pyperclip==1.11.0",
    "platformdirs==4.9.2",
]

[project.scripts]
take-note = "lazy_take_notes.l4_frameworks_and_drivers.cli:cli"
lazy-take-notes = "lazy_take_notes.l4_frameworks_and_drivers.cli:cli"

[project.urls]
Homepage = "https://github.com/CJHwong/lazy-take-notes"
Repository = "https://github.com/CJHwong/lazy-take-notes"
Issues = "https://github.com/CJHwong/lazy-take-notes/issues"

[dependency-groups]
dev = [
    "pytest==9.0.2",
    "pytest-asyncio==1.3.0",
    "pytest-cov==7.0.0",
    "textual-dev==1.8.0",
    "import-linter==2.10",
]

[tool.hatch.build.targets.wheel]
packages = ["src/lazy_take_notes"]
artifacts = [
    "src/lazy_take_notes/_native/bin/coreaudio-tap",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "W",    # pycodestyle warnings
    "I",    # isort
    "B",    # flake8-bugbear
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "S",    # flake8-bandit
    "PLC",  # pylint convention
]
preview = true

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "PLC0415"]
"test_*" = ["S", "PLC0415"]
"scripts/*" = ["S"]

[tool.ruff.format]
quote-style = "single"

[tool.ty.environment]
python-version = "3.11"
python = ".venv"

[tool.coverage.run]
source = ["lazy_take_notes"]
omit = ["src/lazy_take_notes/__main__.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    '^\s*\.\.\.\s*$',
]

[tool.importlinter]
root_packages = ["lazy_take_notes"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "L1 entities must not import L2, L3, L4, or framework libs"
type = "forbidden"
source_modules = ["lazy_take_notes.l1_entities"]
forbidden_modules = [
    "lazy_take_notes.l2_use_cases",
    "lazy_take_notes.l3_interface_adapters",
    "lazy_take_notes.l4_frameworks_and_drivers",
    "textual",
    "ollama",
    "openai",
    "pywhispercpp",
    "yaml",
    "click",
    "sounddevice",
    "soundcard",
]

[[tool.importlinter.contracts]]
name = "L2 use cases must not import L3, L4, or framework libs"
type = "forbidden"
source_modules = ["lazy_take_notes.l2_use_cases"]
forbidden_modules = [
    "lazy_take_notes.l3_interface_adapters",
    "lazy_take_notes.l4_frameworks_and_drivers",
    "textual",
    "ollama",
    "openai",
    "pywhispercpp",
    "yaml",
    "click",
    "sounddevice",
    "soundcard",
]

[[tool.importlinter.contracts]]
name = "L3 adapters must not import L4"
type = "forbidden"
source_modules = ["lazy_take_notes.l3_interface_adapters"]
forbidden_modules = [
    "lazy_take_notes.l4_frameworks_and_drivers",
]

[[tool.importlinter.contracts]]
name = "L3 adapters must not import textual"
type = "forbidden"
source_modules = ["lazy_take_notes.l3_interface_adapters"]
forbidden_modules = [
    "textual",
]
